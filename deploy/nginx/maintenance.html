<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#06100d">
    <meta name="robots" content="noindex">
    <title>Onda em manutenção</title>
    <style>
        :root {
            color-scheme: dark;
            --forest: #06100d;
            --forest-soft: #0c1d17;
            --cream: #f7f3eb;
            --lime: #cdf27c;
            --lime-bright: #dcff8d;
            --muted: rgba(247, 243, 235, 0.62);
            --line: rgba(247, 243, 235, 0.13);
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            min-height: 100dvh;
            place-items: center;
            padding: 1.25rem;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 18%, rgba(205, 242, 124, 0.13), transparent 34%),
                radial-gradient(circle at 12% 100%, rgba(44, 126, 96, 0.18), transparent 38%),
                var(--forest);
            color: var(--cream);
        }

        .maintenance-card {
            width: min(100%, 29rem);
            padding: clamp(1.6rem, 5vw, 2.4rem);
            border: 1px solid var(--line);
            border-radius: 1.6rem;
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.035), transparent 40%),
                var(--forest-soft);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.48);
            text-align: center;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            margin-bottom: 1.5rem;
            color: var(--cream);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .brand-mark {
            display: grid;
            width: 2.35rem;
            height: 2.35rem;
            place-items: center;
            border-radius: 0.85rem;
            background: var(--lime);
            color: var(--forest);
        }

        .brand-mark svg {
            width: 1.35rem;
            height: 1.35rem;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin: 0;
            color: var(--lime);
            font-size: 0.58rem;
            font-weight: 800;
            letter-spacing: 0.16em;
        }

        .eyebrow-dot {
            width: 0.42rem;
            height: 0.42rem;
            border-radius: 50%;
            background: var(--lime);
            box-shadow: 0 0 0 0.22rem rgba(205, 242, 124, 0.12);
        }

        h1 {
            margin: 0.8rem 0 0.75rem;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.9rem, 8vw, 2.8rem);
            font-weight: 700;
            letter-spacing: -0.045em;
            line-height: 1.02;
        }

        .copy {
            max-width: 23rem;
            margin: 0 auto;
            color: var(--muted);
            font-size: 0.84rem;
            line-height: 1.65;
        }

        .retry-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            min-height: 2.85rem;
            margin-top: 1.45rem;
            padding: 0.75rem 1.35rem;
            border: 0;
            border-radius: 999px;
            background: var(--lime);
            color: var(--forest);
            cursor: pointer;
            font: inherit;
            font-size: 0.77rem;
            font-weight: 800;
            transition: background-color 160ms ease, transform 160ms ease;
        }

        .retry-button:hover {
            background: var(--lime-bright);
            transform: translateY(-1px);
        }

        .retry-button:focus-visible {
            outline: 2px solid var(--cream);
            outline-offset: 3px;
        }

        .retry-button:disabled {
            cursor: wait;
            opacity: 0.72;
            transform: none;
        }

        .retry-button svg {
            width: 1rem;
            height: 1rem;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2;
        }

        .status {
            min-height: 1.2rem;
            margin: 0.9rem 0 0;
            color: rgba(247, 243, 235, 0.38);
            font-size: 0.65rem;
            line-height: 1.4;
        }

        .status.is-error {
            color: #ffb4a2;
        }

        @media (prefers-reduced-motion: reduce) {
            .retry-button {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main class="maintenance-card" aria-labelledby="maintenance-title">
        <div class="brand" aria-label="Onda">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M2.5 12h3.2l2-5.2 3.6 11.4L15 4l2.2 8h4.3"/></svg>
            </span>
            <span>onda.</span>
        </div>

        <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span>ATUALIZAÇÃO EM ANDAMENTO</p>
        <h1 id="maintenance-title">O Onda está voltando.</h1>
        <p class="copy">
            O servidor está reiniciando para uma atualização.
            Isso costuma levar menos de um minuto.
        </p>

        <button type="button" class="retry-button" id="retry-button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
            <span id="retry-label">Tentar novamente</span>
        </button>

        <p class="status" id="status" role="status" aria-live="polite">
            Sua sala continua disponível quando a atualização terminar.
        </p>
    </main>

    <script>
        (() => {
            const button = document.getElementById("retry-button");
            const label = document.getElementById("retry-label");
            const status = document.getElementById("status");

            button?.addEventListener("click", () => {
                button.disabled = true;
                label.textContent = "Tentando...";
                status.textContent = "Recarregando a página...";
                status.classList.remove("is-error");

                window.setTimeout(() => {
                    window.location.reload();
                }, 160);
            });
        })();
    </script>
</body>
</html>
